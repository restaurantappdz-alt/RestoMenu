<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🍽️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RestoMenu — Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="dark bg-[#0D0D0D] text-[#fafafa] antialiased">
    <div id="root"></div>
    <div id="error-root" style="display:none;padding:2rem;color:#ef4444;font-family:monospace;white-space:pre-wrap;font-size:14px;line-height:1.5;"></div>
    <script>
      (function() {
        var root = document.getElementById('root');
        root.innerHTML = '<p style="padding:2rem;color:#D4AF37;font-family:sans-serif;text-align:center;font-size:18px;">RestoMenu loading...</p>';
        var errorEl = document.getElementById('error-root');
        function showError(msg, detail) {
          root.style.display = 'none';
          errorEl.style.display = 'block';
          errorEl.textContent = '❌ ' + msg + '\n' + (detail || '');
        }
        window.onerror = function(msg, url, line, col, err) {
          showError(msg || 'Script error', 'File: ' + url + '\nLine: ' + line);
          return true;
        };
        window.addEventListener('unhandledrejection', function(e) {
          showError('Unhandled Promise', e.reason && e.reason.message ? e.reason.message : String(e.reason));
        });
        // If React doesn't replace the content in 5 seconds, show fallback
        setTimeout(function() {
          if (root.children.length > 0 && root.firstChild.tagName === 'P') {
            root.innerHTML = '<p style="padding:2rem;color:#ef4444;font-family:sans-serif;text-align:center;font-size:16px;">⏱️ App taking too long to load. Check browser console (F12) for errors.</p>';
          }
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

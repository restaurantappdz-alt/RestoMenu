<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <filter id="glowDot" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Sandwich icon — larger, more visible -->
  <g transform="translate(40, 50) scale(0.6)" stroke="#FF7A00" stroke-width="2.5" fill="none" opacity="0.12">
    <path d="M-20 10 Q0 -10 20 10" stroke-linecap="round"/>
    <rect x="-18" y="8" width="36" height="3" rx="1.5"/>
    <rect x="-24" y="14" width="48" height="3" rx="1.5"/>
    <path d="M-22 18 Q0 28 22 18" stroke-linecap="round"/>
    <rect x="-10" y="20" width="20" height="2" rx="1"/>
  </g>

  <!-- Flame icon — orange accent -->
  <g transform="translate(140, 40) scale(0.5)" stroke="#FF5100" stroke-width="2.5" fill="none" opacity="0.14">
    <path d="M0 20 Q-10 8 -4 -2 Q0 4 4 -2 Q10 8 0 20Z" stroke-linejoin="round"/>
    <path d="M0 20 Q-4 12 0 6 Q4 12 0 20Z" fill="#FF5100" opacity="0.08"/>
  </g>

  <!-- Fries icon -->
  <g transform="translate(230, 55) scale(0.5)" stroke="#FFB703" stroke-width="2" fill="none" opacity="0.12">
    <rect x="-12" y="0" width="24" height="20" rx="2"/>
    <line x1="-8" y1="-10" x2="-6" y2="0" stroke-linecap="round"/>
    <line x1="0" y1="-14" x2="0" y2="0" stroke-linecap="round"/>
    <line x1="8" y1="-10" x2="6" y2="0" stroke-linecap="round"/>
  </g>

  <!-- Small sandwich — offset -->
  <g transform="translate(180, 200) scale(0.4)" stroke="#FF7A00" stroke-width="2" fill="none" opacity="0.1">
    <path d="M-20 10 Q0 -10 20 10" stroke-linecap="round"/>
    <rect x="-18" y="8" width="36" height="3" rx="1.5"/>
    <path d="M-22 18 Q0 28 22 18" stroke-linecap="round"/>
  </g>

  <!-- Small flame -->
  <g transform="translate(30, 220) scale(0.35)" stroke="#FF5100" stroke-width="2.5" fill="none" opacity="0.1">
    <path d="M0 20 Q-10 8 -4 -2 Q0 4 4 -2 Q10 8 0 20Z"/>
  </g>

  <!-- Small fries -->
  <g transform="translate(120, 240) scale(0.35)" stroke="#FFB703" stroke-width="2" fill="none" opacity="0.1">
    <rect x="-12" y="0" width="24" height="20" rx="2"/>
    <line x1="-8" y1="-10" x2="-6" y2="0" stroke-linecap="round"/>
    <line x1="0" y1="-14" x2="0" y2="0" stroke-linecap="round"/>
    <line x1="8" y1="-10" x2="6" y2="0" stroke-linecap="round"/>
  </g>

  <!-- Glowing scatter dots -->
  <circle cx="20" cy="120" r="2.5" fill="#6B9CFF" opacity="0.15" filter="url(#glowDot)"/>
  <circle cx="80" cy="20" r="1.5" fill="#6B9CFF" opacity="0.12"/>
  <circle cx="200" cy="130" r="2" fill="#6B9CFF" opacity="0.15" filter="url(#glowDot)"/>
  <circle cx="280" cy="170" r="1.5" fill="#6B9CFF" opacity="0.12"/>
  <circle cx="70" cy="280" r="2" fill="#6B9CFF" opacity="0.15" filter="url(#glowDot)"/>
  <circle cx="250" cy="270" r="1.5" fill="#6B9CFF" opacity="0.12"/>
  <circle cx="150" cy="100" r="1.5" fill="#6B9CFF" opacity="0.12"/>
  <circle cx="90" cy="180" r="1" fill="#6B9CFF" opacity="0.1"/>
  <circle cx="220" cy="40" r="1" fill="#6B9CFF" opacity="0.1"/>
  <circle cx="280" cy="120" r="1" fill="#6B9CFF" opacity="0.1"/>
</svg>

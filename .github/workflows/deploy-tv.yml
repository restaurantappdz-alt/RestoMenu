name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'tv-display/**'
      - 'admin-dashboard/**'
      - 'shared/**'
      - '.github/workflows/deploy-tv.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            tv-display/package-lock.json
            admin-dashboard/package-lock.json

      - name: Build TV display
        run: |
          npm ci
          npm run build
        working-directory: tv-display

      - name: Build Admin dashboard
        run: |
          npm ci
          npm run build
        working-directory: admin-dashboard

      - name: Combine both apps into one artifact
        run: |
          mkdir -p combined/dashboard
          cp -r tv-display/dist/* combined/
          cp -r admin-dashboard/dist/* combined/dashboard/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: combined
      - id: deployment
        uses: actions/deploy-pages@v4
